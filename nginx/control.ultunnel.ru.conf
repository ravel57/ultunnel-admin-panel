# control.ultunnel.ru — сбор посещённых доменов и управление раздельной
# маршрутизацией. Проксирует в то же приложение ultunnel-admin-panel, что и
# админка, но наружу пускает только /control: админский API и форма логина с
# этого хоста недоступны.
#
# Установка:
#   sudo cp nginx/snippets/ultunnel-proxy.conf /etc/nginx/snippets/
#   sudo cp nginx/control.ultunnel.ru.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/control.ultunnel.ru.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d control.ultunnel.ru
#   sudo nginx -t && sudo systemctl reload nginx

upstream ultunnel_control {
    # Порт из docker-compose.yaml (webapp: '56485:8081').
    server 127.0.0.1:56485;
    keepalive 16;
}

# Клиентские приложения шлют домены пачками и часто. Лимит щедрый, но не
# бесконечный: один ключ не должен укладывать сбор для всех остальных.
limit_req_zone $http_x_secret_key zone=control_visits:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=control_api:10m rate=600r/m;

server {
    listen 80;
    listen [::]:80;
    server_name control.ultunnel.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name control.ultunnel.ru;

    ssl_certificate     /etc/letsencrypt/live/control.ultunnel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.ultunnel.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Отчёт на 2000 доменов — около 100 КБ; запас на длинные имена.
    client_max_body_size 1m;

    access_log /var/log/nginx/control.ultunnel.ru.access.log;
    error_log  /var/log/nginx/control.ultunnel.ru.error.log;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # --- API клиентского приложения и веб-интерфейса ---------------------

    location = /control/api/v1/visits {
        limit_req zone=control_visits burst=30 nodelay;
        limit_req zone=control_api burst=120 nodelay;
        limit_req_status 429;
        include snippets/ultunnel-proxy.conf;
        proxy_pass http://ultunnel_control;
    }

    location /control/api/v1/ {
        limit_req zone=control_api burst=120 nodelay;
        limit_req_status 429;
        include snippets/ultunnel-proxy.conf;
        proxy_pass http://ultunnel_control;
    }

    # --- Веб-интерфейс ----------------------------------------------------

    # Корень этого хоста — страница раздельной маршрутизации, а не админка.
    location = / {
        include snippets/ultunnel-proxy.conf;
        proxy_pass http://ultunnel_control/control;
    }

    location = /control {
        include snippets/ultunnel-proxy.conf;
        proxy_pass http://ultunnel_control/control;
    }

    # Статика общая с админкой: один и тот же бандл выбирает макет по хосту.
    location ~ ^/(js|css|png|svg|assets)/ {
        include snippets/ultunnel-proxy.conf;
        proxy_pass http://ultunnel_control;
        # expires сам выставляет Cache-Control; add_header здесь обнулил бы
        # заголовки, унаследованные от уровня server.
        expires 7d;
    }

    location = /favicon.png {
        include snippets/ultunnel-proxy.conf;
        proxy_pass http://ultunnel_control;
    }

    # --- Всё остальное закрыто -------------------------------------------
    # /api/v1/**, /login и прочая админка с этого хоста не отвечают, даже если
    # кто-то узнает имена путей.
    location / {
        return 404;
    }
}
